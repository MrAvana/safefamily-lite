# Local backend services.
#
# The phonebook is the watch's call whitelist: with "Protect from Stranger
# Calls" on, a caller who is not in it is rejected. The write replaces the
# whole list, and the backend refuses one that drops a number it protects.

set_local_contacts:
  name: Set phonebook (local backend)
  description: >
    Replace the watch's whole phonebook, as a JSON array of
    {"name": ..., "number": ..., "icon": 0-8, "is_sos": true|false}.
    The watch cannot be read back, so the backend keeps this list and
    re-writes it at every login. At most 13 entries. At least one entry must
    be marked is_sos: that number is the guardian the backend refuses to lose,
    and every form of it is protected. This service replaces the list even
    when the backend has no record of one, so use it deliberately -- the
    add/remove services refuse that case instead. The watch picker lists local
    SafeFamily Lite devices; scripts can still pass `imei`.
  fields:
    watch:
      required: true
      selector:
        device:
          filter:
            - integration: safefamily_lite
    contacts_json:
      required: true
      example: '[{"name":"Dad","number":"+261340000000","icon":0,"is_sos":true}]'
      selector: { text: { multiline: true } }

add_local_contact:
  name: Add phonebook entry (local backend)
  description: >
    Add one entry, keeping the rest. Both the international (+261...) and
    domestic (0...) forms of the number are stored, because a caller ID may
    present either and the watch compares strings; only the international one
    is marked SOS. The number is validated against Home Assistant's country
    setting (Settings > System > General > Country), and refused if it cannot
    be a real subscriber number, so a typo cannot be stored as an entry that
    will never ring. The list is replaced wholesale on the wire, so this reads
    the stored copy, replaces any entry for the same subscriber, and writes
    the result back. With sos on, this entry becomes the guardian: the previous
    SOS flag is cleared, because the watch has one SOS button. The watch
    picker lists local SafeFamily Lite devices; scripts can still pass `imei`.
  fields:
    watch:
      required: true
      selector:
        device:
          filter:
            - integration: safefamily_lite
    name:      { required: true, example: "Dad", selector: { text: {} } }
    number:    { required: true, example: "+261340000000", selector: { text: {} } }
    icon:
      example: "Father"
      selector:
        select:
          options:
            - "Father"
            - "Mother"
            - "Sister"
            - "Grandpa"
            - "Granny"
            - "Brother"
            - "Other"
    sos:       { selector: { boolean: {} } }

remove_local_contact:
  name: Remove phonebook entry (local backend)
  description: >
    Remove one entry, keeping the rest. Every stored form of the number goes,
    so removing +261340000000 also removes 0340000000; leaving one behind
    would keep the number ringing while the list said it was gone. Matching
    ignores +, spaces and dashes, so the number need not be written exactly as
    stored, and a call that matches nothing fails rather than reporting
    success. A number the backend protects cannot be removed. The watch
    picker lists local SafeFamily Lite devices; scripts can still pass `imei`.
  fields:
    watch:
      required: true
      selector:
        device:
          filter:
            - integration: safefamily_lite
    number:    { required: true, example: "+261340000000", selector: { text: {} } }

send_local_voice:
  name: Send voice message (local backend)
  description: >
    Queue an AMR-NB voice file for the watch. `url` must be reachable from
    Home Assistant itself, for example
    http://127.0.0.1:8123/local/hello.amr for a file in /config/www. The file
    is validated and stored by the backend, then handed to the watch as it
    asks for it. `notify` sends the immediate alert, which may play aloud on
    the wrist; leave it off for a silent queue that waits for the child to
    open the message. The watch picker lists local SafeFamily Lite devices;
    scripts can still pass `imei` instead of `watch`.
  fields:
    watch:
      required: false
      selector:
        device:
          filter:
            - integration: safefamily_lite
    imei:
      required: false
      example: "123456789012345"
      selector: { text: {} }
    url:
      required: true
      example: "http://127.0.0.1:8123/local/hello.amr"
      selector: { text: {} }
    notify:
      default: false
      selector: { boolean: {} }

send_local_text:
  name: Send text notification (local backend)
  description: >
    Show a short text notification on the watch and make it beep. This is the
    watch's own on-screen overlay, not an SMS: it is transient and does not
    appear in the Messaging app or create an inbox entry. The watch must be
    connected now; the message is never queued, so a watch that is offline
    fails instead of showing the text at some later login. Up to 64
    characters. The watch picker lists local SafeFamily Lite devices; scripts
    can still pass `imei` instead of `watch`.
  fields:
    watch:
      required: false
      selector:
        device:
          filter:
            - integration: safefamily_lite
    imei:
      required: false
      example: "123456789012345"
      selector: { text: {} }
    text:
      required: true
      example: "Time to come home"
      selector: { text: { multiline: true } }

send_tts_voice:
  name: Send TTS voice message (local backend)
  description: >
    Generate a spoken message with a Home Assistant text-to-speech engine and
    send it to the watch. The backend converts the engine's MP3/WAV output to
    the AMR-NB format the watch requires. By default the local `tts.piper`
    engine is used; pass `engine` to choose another TTS entity. `notify` sends
    the immediate audible alert, while `burst` pushes the audio to a connected
    watch now instead of leaving it queued. The watch picker lists the local
    SafeFamily Lite devices; scripts can still pass `imei` instead of `watch`.
  fields:
    watch:
      required: true
      selector:
        device:
          filter:
            - integration: safefamily_lite
    message:
      required: true
      example: "Hello, time to come home."
      selector: { text: { multiline: true } }
    engine:
      example: "tts.piper"
      selector:
        entity:
          domain: tts
    language:
      example: "en_US"
      selector:
        select:
          mode: dropdown
          custom_value: true
          options:
            - en_US
            - en_GB
            - fr_FR
            - de_DE
            - es_ES
            - it_IT
            - pt_BR
            - pt_PT
            - nl_NL
            - pl_PL
            - ru_RU
            - zh_CN
            - ja_JP
            - ko_KR
    options:
      example: { voice: "en_US-lessac-medium" }
      selector: { object: {} }
    notify:
      default: false
      selector: { boolean: {} }
    burst:
      default: true
      selector: { boolean: {} }
